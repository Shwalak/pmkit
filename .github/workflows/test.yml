name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (includes a check that the README example outputs are current)
        run: pytest -q
      - name: The bundled example PRDs pass the checker
        run: |
          pmkit prd check examples/prds/shipgate-prd.md
          pmkit prd check examples/prds/lead-quality-lens-prd.md
      - name: A broken traffic split is refused
        run: pmkit ab readout --control 500/5000 --treatment 700/5400 | grep -q "Do not trust this result"
