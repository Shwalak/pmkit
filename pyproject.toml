[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmkit"
version = "0.1.0"
description = "A small, tested toolkit for product managers: A/B test readouts, sample-size planning and a PRD checker."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pmkit = "pmkit.cli:main"

[tool.setuptools]
packages = ["pmkit"]

[tool.setuptools.package-data]
pmkit = ["prd_template.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
